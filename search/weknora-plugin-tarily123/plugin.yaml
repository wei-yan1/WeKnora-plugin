api_version: weknora.plugin/v1
id: weknora.tarily123
name: TARily Web Search (Docker Test)
version: 1.0.2
extension_type: search
protocol_version: v1
weknora_version: ">=0.7 <1.0"
entrypoint: docker://weknora-plugin-tarily:latest
capabilities: [search]
metadata:
  provider_type: TARily123
  description: Docker-test copy of the Tavily Search plugin (isolated/OCI). Distinct id TARily123 so it can load alongside weknora.tarily.
  docs_url: https://tavily.com/
  icon: tarily.png
permissions:
  network: allowlist
  allowed_destinations:
    - "api.tavily.com:443"
config_schema:
  type: object
  properties:
    credentials:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          secret: true
          description: Tavily Search API Key
    settings:
      type: object
      properties:
        base_url:
          type: string
          description: Optional Tavily API endpoint override (defaults to https://api.tavily.com/search)
        proxy_url:
          type: string
          description: Optional HTTP/HTTPS proxy URL for outbound requests
